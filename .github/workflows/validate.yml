name: Validate PowerHelp
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test generator and search
        run: node tests/test-core.js
      - name: Generate parser cases
        run: node tests/generate-cases.js cases.json
      - name: Check syntax with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/validate-powershell.ps1 -CaseFile cases.json
      - name: Generate extraction examples
        run: node tests/generate-extraction.js extraction.json
      - name: Run text and folder extraction with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/test-extraction.ps1 -CaseFile extraction.json
      - name: Export Windows command metadata
        shell: powershell
        run: ./tools/Export-PowerHelpCatalog.ps1 -Path catalog.json -EmitCompressed
